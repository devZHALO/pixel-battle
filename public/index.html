<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Battle · 500×500</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Экран авторизации -->
  <section id="auth-screen" class="screen">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-px" style="background:#BE0039"></span>
        <span class="logo-px" style="background:#FFA800"></span>
        <span class="logo-px" style="background:#3690EA"></span>
        <span class="logo-px" style="background:#00CC78"></span>
      </div>
      <h1>Pixel Battle</h1>
      <p class="auth-sub">Холст 500×500. Один пиксель за раз. Одна минута кулдауна.</p>

      <div class="tabs" role="tablist">
        <button class="tab active" id="tab-login" type="button">Вход</button>
        <button class="tab" id="tab-register" type="button">Регистрация</button>
      </div>

      <form id="login-form" class="auth-form" autocomplete="on">
        <label class="field">
          <span>Никнейм</span>
          <input type="text" id="login-username" autocomplete="username" required maxlength="20">
        </label>
        <label class="field">
          <span>Пароль</span>
          <input type="password" id="login-password" autocomplete="current-password" required maxlength="72">
        </label>
        <button type="submit" class="btn-primary">Войти</button>
        <p class="form-error" id="login-error"></p>
      </form>

      <form id="register-form" class="auth-form hidden" autocomplete="on">
        <label class="field">
          <span>Никнейм</span>
          <input type="text" id="register-username" autocomplete="username" required maxlength="20" placeholder="3–20 символов">
        </label>
        <label class="field">
          <span>Пароль</span>
          <input type="password" id="register-password" autocomplete="new-password" required maxlength="72" placeholder="от 4 символов">
        </label>
        <div class="terms-block">
          <label class="checkbox-row">
            <input type="checkbox" id="accept-tos">
            <span>Я прочитал(а) и принимаю <button type="button" class="link-btn" id="open-tos-btn">Условия использования</button></span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox" id="accept-privacy">
            <span>Я прочитал(а) и принимаю <button type="button" class="link-btn" id="open-privacy-btn">Политику конфиденциальности</button></span>
          </label>
        </div>
        <button type="submit" class="btn-primary" id="register-submit" disabled>Создать аккаунт</button>
        <p class="form-error" id="register-error"></p>
      </form>
    </div>
    <div class="auth-footer">Создал сайт: <a href="https://t.me/oguricappu" target="_blank" rel="noopener noreferrer">t.me/oguricappu</a></div>
  </section>

  <!-- Модалка: Условия использования / Политика конфиденциальности -->
  <div class="modal-overlay hidden" id="legal-modal">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button type="button" class="modal-close" id="modal-close" aria-label="Закрыть">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn-primary" id="modal-ok">Понятно</button>
      </div>
    </div>
  </div>

  <!-- Экран холста -->
  <section id="app-screen" class="screen hidden">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-text">Pixel&nbsp;Battle</span>
        </div>
        <div class="coords" id="hover-coords">X: — Y: —</div>
      </div>
      <div class="topbar-right">
        <span class="user-pill" id="user-pill">
          <span id="username-label"></span>
        </span>
        <button id="logout-btn" class="btn-ghost" type="button">Выйти</button>
      </div>
    </header>

    <main class="canvas-wrap" id="canvas-wrap">
      <canvas id="view-canvas"></canvas>
      <div class="side-controls">
        <button id="zoom-in" type="button" title="Приблизить">+</button>
        <button id="zoom-out" type="button" title="Отдалить">−</button>
        <button id="zoom-fit" type="button" title="По размеру экрана">⤢</button>
        <button id="download-btn" type="button" title="Скачать карту как PNG" class="download-btn">⬇</button>
      </div>
      <div class="toast" id="toast"></div>
    </main>

    <footer class="palette-bar">
      <div class="palette-row">
        <div class="cooldown-box">
          <div class="cooldown-ring" id="cooldown-ring">
            <span id="cooldown-text">•</span>
          </div>
          <div class="cooldown-label" id="cooldown-label">Готов рисовать</div>
        </div>
        <div class="current-color" id="current-color" title="Текущий цвет"></div>
        <div class="palette" id="palette"></div>
      </div>
    </footer>
  </section>

  <script src="app.js"></script>
</body>
</html>
